name: Lean CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      clean_project:
        description: Start validation without restored project build artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check architecture source graph and Python tooling
        run: |
          python -m py_compile tools/architecture/project_roots.py tools/architecture/migrate_diagnostic_roots.py tools/architecture/check_tiers.py tools/architecture/check_placeholders.py tools/architecture/generate_baseline.py tools/architecture/check_layout.py tools/architecture/check_warnings.py tools/architecture/check_lint.py tools/architecture/check_provenance.py tools/architecture/check_links.py tools/architecture/normalize_apache_notices.py tools/architecture/sort_aggregate_imports.py tools/benchmark/run.py
          python tools/architecture/check_warnings.py --self-test
          python tools/architecture/check_lint.py --self-test
          python tools/architecture/check_links.py --self-test
          python tools/architecture/migrate_diagnostic_roots.py --self-test
          python tools/architecture/check_layout.py
          python tools/architecture/check_tiers.py --self-test
          python tools/architecture/check_tiers.py
          python tools/architecture/check_placeholders.py --self-test
          python tools/architecture/check_placeholders.py
          python tools/architecture/check_provenance.py
          python tools/architecture/check_links.py
          python tools/architecture/generate_baseline.py --skip-declarations --strict-source --output-dir benchmark-results/ci-architecture --name source
      - name: Build library and smoke tests
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: --quiet ComputationalMathematics NumStabilityTest
          use-github-cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clean_project) }}
          test: false
          lint: false
      - name: Run lake test
        run: lake test
      - name: Check the warning baseline
        id: warning_baseline
        continue-on-error: true
        run: |
          set -o pipefail
          {
            printf '##[group]lake build ComputationalMathematics NumStabilityTest\n'
            printf '[command]/usr/bin/git log -1 --format=%%H\n'
            git log -1 --format=%H
            lean --version
          } | tee "$RUNNER_TEMP/lean-build.log"
          lake build ComputationalMathematics NumStabilityTest 2>&1 | tee -a "$RUNNER_TEMP/lean-build.log"
          printf '##[endgroup]\n' | tee -a "$RUNNER_TEMP/lean-build.log"
          PYTHONIOENCODING=utf-8 python tools/architecture/check_placeholders.py --completion --log "$RUNNER_TEMP/lean-build.log"
          python tools/architecture/check_warnings.py --log "$RUNNER_TEMP/lean-build.log" --baseline docs/architecture/warnings.json --check
      - name: Check the lint baseline
        id: lint_baseline
        continue-on-error: true
        run: |
          lake lint 2>&1 | tee "$RUNNER_TEMP/lean-lint.log" || true
          PYTHONIOENCODING=utf-8 python tools/architecture/check_lint.py --log "$RUNNER_TEMP/lean-lint.log" --baseline docs/architecture/lint.json --check
      - name: Upload diagnostic logs
        if: ${{ always() && steps.lint_baseline.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-diagnostic-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lean-build.log
            ${{ runner.temp }}/lean-lint.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce diagnostic baselines
        if: ${{ always() && steps.lint_baseline.outcome != 'skipped' }}
        env:
          WARNING_OUTCOME: ${{ steps.warning_baseline.outcome }}
          LINT_OUTCOME: ${{ steps.lint_baseline.outcome }}
        run: |
          if [[ "$WARNING_OUTCOME" != "success" || "$LINT_OUTCOME" != "success" ]]; then
            echo "warning baseline: $WARNING_OUTCOME"
            echo "lint baseline: $LINT_OUTCOME"
            exit 1
          fi
      - name: Capture clean compiled graph and downstream consumer
        id: clean_identity_evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_project }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lcm-cutover-evidence"
          consumer="$RUNNER_TEMP/lcm-identity-consumer"
          mkdir -p "$evidence" "$consumer"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$evidence/commit.txt"
          lean --version > "$evidence/lean-version.txt"
          cp lean-toolchain lake-manifest.json "$evidence/"
          sha256sum tools/architecture/declaration_dependencies.lean > "$evidence/extractor.sha256"
          lake env lean --run tools/architecture/declaration_dependencies.lean --self-test 2>&1 | tee "$evidence/extractor-self-test.log"
          lake env lean --run tools/architecture/declaration_dependencies.lean "$evidence/declarations.tsv" 2>&1 | tee "$evidence/extraction.log"
          python tools/architecture/generate_baseline.py --strict-source --dependency-tsv "$evidence/declarations.tsv" --output-dir "$evidence" --name compiled
          gzip -n "$evidence/declarations.tsv"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          root = Path(os.environ['GITHUB_WORKSPACE'])
          evidence = Path(os.environ['RUNNER_TEMP']) / 'lcm-cutover-evidence'
          consumer = Path(os.environ['RUNNER_TEMP']) / 'lcm-identity-consumer'
          families = ['FloatingPoint', 'Stability', 'Gaussian', 'Vershynin', 'LeVeque', 'MatrixNotation']
          modules = []; hashes = {}
          for branch in ['Canonical']:
              for family in families:
                  relative = Path(branch) / (family + '.lean')
                  source = root / 'NumStabilityTest/Import/ProjectIdentity' / relative
                  destination = consumer / 'Consumer' / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, destination)
                  hashes[destination.relative_to(consumer).as_posix()] = hashlib.sha256(destination.read_bytes()).hexdigest()
                  modules.append('Consumer.' + branch + '.' + family)
          (consumer / 'Consumer.lean').write_text(''.join('import ' + module + '\n' for module in sorted(modules)), encoding='utf-8')
          (consumer / 'lakefile.toml').write_text(
              'name = "lcmIdentityConsumer"\nversion = "0.1.0"\ndefaultTargets = ["Consumer"]\n'
              'packagesDir = ' + json.dumps(str(root / '.lake/packages')) + '\n'
              '\n[[lean_lib]]\nname = "Consumer"\n'
              '\n[[require]]\nname = "numStability"\npath = ' + json.dumps(str(root)) + '\n', encoding='utf-8')
          shutil.copyfile(root / 'lean-toolchain', consumer / 'lean-toolchain')
          (evidence / 'consumer-source-hashes.json').write_text(json.dumps(hashes, indent=2) + '\n', encoding='utf-8')
          representatives = [
              'NumStability.mixedForwardBackward_of_backward',
              'NumStability.integral_abs_mul_standardGaussianPDF_eq_sqrt',
              'NumStability.HDP.Contract.hdp_02_hthm_h2_d2_d6',
              'NumStability.leveque01_equation03_advectedProfile',
              'NumStability.FPModel.model_basicOp',
              'NumStability.FPModel.exactWithUnitRoundoff',
              'NumStability.matMul_id_right',
          ]
          (evidence / 'Axioms.lean').write_text('import ComputationalMathematics\n\n' +
              ''.join('#print axioms ' + name + '\n' for name in representatives), encoding='utf-8')
          PY
          lake env lean "$evidence/Axioms.lean" > "$evidence/axioms.log" 2>&1
          (
            cd "$consumer"
            # Reuse the pinned dependencies already built above when resolving this consumer.
            MATHLIB_NO_CACHE_ON_UPDATE=1 lake --keep-toolchain update 2>&1 | tee "$evidence/consumer-update.log"
            python - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ['GITHUB_WORKSPACE'])
          expected = json.loads((root / 'lake-manifest.json').read_text())
          actual = json.loads(Path('lake-manifest.json').read_text())
          def revisions(manifest):
              return {p['name']: (p['url'], p['rev']) for p in manifest['packages'] if p['type'] == 'git'}
          assert revisions(actual) == revisions(expected), 'consumer transitive dependency pins changed'
          local = [p for p in actual['packages'] if p['name'] == 'numStability']
          assert len(local) == 1 and local[0]['type'] == 'path', 'consumer did not resolve the local project dependency'
          print('consumer package dependency and exact transitive revisions verified')
          PY
            lake build Consumer 2>&1 | tee "$evidence/consumer-build.log"
          )
          cp "$consumer/lakefile.toml" "$evidence/consumer-lakefile.toml"
          cp "$consumer/lake-manifest.json" "$evidence/consumer-lake-manifest.json"
          printf 'PASS\n' > "$evidence/consumer-result.txt"

      - name: Upload clean comparison evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.clean_project && steps.clean_identity_evidence.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: clean-identity-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/lcm-cutover-evidence/
          if-no-files-found: error
          retention-days: 14
